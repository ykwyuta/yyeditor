[workspace]
resolver = "3"
members = [
    "crates/yy-buffer",
    "crates/yy-jobs",
    "crates/yy-config",
    "crates/yy-encoding",
    "crates/yy-io",
    "crates/yy-search",
    "crates/yy-delimited",
    "crates/yy-core",
    "crates/yy-layout",
    "crates/yy-syntax",
    "crates/yy-preview",
    "crates/yy-proto",
    "crates/yy-remote",
    "crates/yy-ssh",
    "crates/yy-term",
    "crates/yy-3270",
    "crates/yy-3270-macro",
    "crates/yy-3270-mock",
    "crates/yy-3270-tls",
    "crates/yy-numfmt",
    "crates/yy-sheet",
    "crates/yy-win",
    "apps/yyeditor",
    "apps/yyterm",
    "apps/yysftp",
    "apps/yysheet",
    "apps/yy-agent",
    "tools/gen-bigfile",
    "tools/gen-tables",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
# 追加の許可（Microsoft Edge WebView2 Loader とのリンク）は COPYING.EXCEPTION
license = "GPL-3.0-or-later"
repository = "https://github.com/ykwyuta/yyeditor"

[workspace.dependencies]
yy-buffer = { path = "crates/yy-buffer" }
yy-jobs = { path = "crates/yy-jobs" }
yy-config = { path = "crates/yy-config" }
yy-encoding = { path = "crates/yy-encoding" }
yy-3270 = { path = "crates/yy-3270" }
yy-3270-macro = { path = "crates/yy-3270-macro" }
yy-3270-tls = { path = "crates/yy-3270-tls", default-features = false }
yy-io = { path = "crates/yy-io" }
yy-numfmt = { path = "crates/yy-numfmt" }
yy-sheet = { path = "crates/yy-sheet" }
yy-search = { path = "crates/yy-search" }
yy-delimited = { path = "crates/yy-delimited" }
yy-core = { path = "crates/yy-core" }
yy-layout = { path = "crates/yy-layout" }
yy-syntax = { path = "crates/yy-syntax" }
yy-preview = { path = "crates/yy-preview" }
yy-proto = { path = "crates/yy-proto" }
yy-remote = { path = "crates/yy-remote" }
yy-ssh = { path = "crates/yy-ssh" }
yy-term = { path = "crates/yy-term" }
yy-agent = { path = "apps/yy-agent" }
yy-win = { path = "crates/yy-win" }

encoding_rs = "0.8.42"
chardetng = "1.0.0"
memchr = "2.7"
regex-automata = "0.4"
regex-syntax = "0.8"
csv = "1.3"
memmap2 = "0.9"
rayon = "1.10"
crossbeam-channel = "0.5"
unicode-segmentation = "1.12"
unicode-width = "0.2"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
miniz_oxide = "0.9.1"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
data-encoding = "2"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
webview2-com = "0.39.1"
thiserror = "2"
proptest = "1"
criterion = "0.8"
tempfile = "3"
windows = "0.62"
windows-numerics = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# パニック時にも Drop（一時ファイルの削除など）が走るよう unwind を維持する
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
