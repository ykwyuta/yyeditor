[workspace]
resolver = "3"
members = [
    "crates/yy-buffer",
    "crates/yy-jobs",
    "crates/yy-config",
    "crates/yy-encoding",
    "crates/yy-io",
    "crates/yy-search",
    "crates/yy-delimited",
    "crates/yy-core",
    "crates/yy-layout",
    "crates/yy-syntax",
    "crates/yy-preview",
    "crates/yy-win",
    "apps/yyeditor",
    "tools/gen-bigfile",
    "tools/gen-tables",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ykwyuta/yyeditor"

[workspace.dependencies]
yy-buffer = { path = "crates/yy-buffer" }
yy-jobs = { path = "crates/yy-jobs" }
yy-config = { path = "crates/yy-config" }
yy-encoding = { path = "crates/yy-encoding" }
yy-io = { path = "crates/yy-io" }
yy-search = { path = "crates/yy-search" }
yy-delimited = { path = "crates/yy-delimited" }
yy-core = { path = "crates/yy-core" }
yy-layout = { path = "crates/yy-layout" }
yy-syntax = { path = "crates/yy-syntax" }
yy-preview = { path = "crates/yy-preview" }
yy-win = { path = "crates/yy-win" }

encoding_rs = "0.8.42"
chardetng = "1.0.0"
memchr = "2.7"
regex-automata = "0.4"
regex-syntax = "0.8"
csv = "1.3"
memmap2 = "0.9"
crossbeam-channel = "0.5"
unicode-segmentation = "1.12"
unicode-width = "0.2"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
miniz_oxide = "0.9.1"
webview2-com = "0.39.1"
thiserror = "2"
proptest = "1"
criterion = "0.8"
tempfile = "3"
windows = "0.62"
windows-numerics = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# パニック時にも Drop（一時ファイルの削除など）が走るよう unwind を維持する
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
