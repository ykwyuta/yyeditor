name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: Windows (build, lint, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (-not (Test-Path $key)) {
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile webview2-setup.exe
            Start-Process -FilePath .\webview2-setup.exe -ArgumentList '/silent','/install' -Wait
          }
          Get-ItemProperty $key -ErrorAction SilentlyContinue | Select-Object pv
          # プレビューのテストで WebView2 を必須にする
          "YY_REQUIRE_WEBVIEW2=1" >> $env:GITHUB_ENV
      - name: test
        run: cargo test --workspace
      - name: build release
        run: cargo build --release -p yyeditor
      - uses: actions/upload-artifact@v4
        with:
          name: yyeditor-windows-x64
          path: target/release/yyeditor.exe

  linux-core:
    name: Linux (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: type-check Windows UI
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo check -p yy-win -p yyeditor --target x86_64-pc-windows-msvc
