services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yytest
      POSTGRES_PASSWORD: Yydb_Test_2026!
      POSTGRES_DB: yytest
    ports: ["127.0.0.1:15432:5432"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: Yydb_Test_2026!
      MYSQL_DATABASE: yytest
      MYSQL_USER: yytest
      MYSQL_PASSWORD: Yydb_Test_2026!
    ports: ["127.0.0.1:13306:3306"]
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Yydb_Test_2026!
    ports: ["127.0.0.1:11433:1433"]
  oracle:
    image: container-registry.oracle.com/database/free:latest-lite
    environment:
      ORACLE_PWD: Yydb_Test_2026!
      ORACLE_CHARACTERSET: AL32UTF8
    ports: ["127.0.0.1:11521:1521"]
    shm_size: 1gb
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    privileged: true
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: Yydb_Test_2026!
      DBNAME: YYTEST
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      TO_CREATE_SAMPLEDB: "false"
      PERSISTENT_HOME: "false"
    ports: ["127.0.0.1:15000:50000"]
