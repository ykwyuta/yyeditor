[package]
name = "yy-db-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde-saphyr = "=1.3.0"
unicode-width = "0.2"
thiserror.workspace = true
tempfile.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled", "column_decltype"] }
duckdb = { version = "=1.4.1", features = ["bundled"] }
rust-db2-driver = { git = "https://github.com/ykwyuta/rust-db2-driver.git", rev = "14999cd983a666b209f0446b398005b141bebb08" }
webpki-roots = "1"
postgres = { version = "=0.19.14", features = ["with-chrono-0_4"] }
chrono = "0.4"
postgres-native-tls = "0.5"
native-tls = "0.2"
mysql = { version = "=28.0.4", default-features = false, features = ["minimal-rust", "native-tls"] }
tiberius = { package = "tiberius-ng", version = "=0.13.1", features = ["chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
oracledb = "=26.0.0-beta.4"
csv = "1"
parquet = { version = "=56.2.1", path = "../../vendor/parquet", default-features = false, features = ["arrow", "snap", "zstd-rust"] }
roxmltree = "0.21"
yy-cobol = { path = "../../../../crates/yy-cobol" }
yy-draw = { path = "../../../../crates/yy-draw" }
yy-sheet = { path = "../../../../crates/yy-sheet" }

[lints.rust]
unsafe_code = "deny"
[[example]]
name = "prepare_demo"
path = "../../../../demo/yydbmanager/tools/prepare.rs"
