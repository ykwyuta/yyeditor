[package]
name = "yy-db-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde-saphyr = "=1.3.0"
unicode-width = "0.2"
thiserror.workspace = true
tempfile.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled", "column_decltype"] }
duckdb = { version = "=1.4.1", features = ["bundled"] }
odbc-api = { version = "=29.2.0", features = ["wide"] }
csv = "1"
parquet = { version = "=56.2.1", default-features = false, features = ["arrow", "snap", "zstd"] }
roxmltree = "0.21"
yy-cobol = { path = "../../../../crates/yy-cobol" }
yy-draw = { path = "../../../../crates/yy-draw" }
yy-sheet = { path = "../../../../crates/yy-sheet" }

[lints.rust]
unsafe_code = "deny"
[[example]]
name = "prepare_demo"
path = "../../../../demo/yydbmanager/tools/prepare.rs"
