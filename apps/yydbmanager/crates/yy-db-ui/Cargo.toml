[package]
name = "yy-db-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yy-db-core.workspace = true
serde_json.workspace = true
serde.workspace = true
tempfile.workspace = true
csv = "1"
yy-cobol = { path = "../../../../crates/yy-cobol" }

[target.'cfg(windows)'.dependencies]
yy-ui-win = { path = "../../../../crates/yy-ui-win", features = ["help"] }
yy-core = { path = "../../../../crates/yy-core" }
yy-layout = { path = "../../../../crates/yy-layout" }
yy-config = { path = "../../../../crates/yy-config" }
yy-draw = { path = "../../../../crates/yy-draw" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Security_Cryptography", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
