[workspace]
resolver = "3"
members = ["app", "crates/yy-db-core", "crates/yy-db-ui", "crates/yy-parquet-zstd"]
exclude = ["vendor/parquet"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
yy-db-core = { path = "crates/yy-db-core" }
yy-db-ui = { path = "crates/yy-db-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
