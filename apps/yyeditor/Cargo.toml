[package]
name = "yyeditor"
description = "Lightweight text editor for Windows with huge file support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "yyeditor"
path = "src/main.rs"

[features]
default = ["ssh"]
# SSH 接続先のファイルの編集（11 章）に使う組み込みの SSH クライアント
ssh = ["dep:yy-ssh"]

[target.'cfg(windows)'.dependencies]
yy-win.workspace = true
yy-ssh = { workspace = true, optional = true }

[lints]
workspace = true
