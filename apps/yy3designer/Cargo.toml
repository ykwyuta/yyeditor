[workspace]
resolver = "3"
members = ["app", "crates/yy3-core", "crates/yy3-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
yy3-core = { path = "crates/yy3-core" }
yy3-ui = { path = "crates/yy3-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
