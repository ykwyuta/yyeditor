[workspace]
resolver = "3"
members = ["app", "crates/yy-merge-core", "crates/yy-merge-cli", "crates/yy-merge-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
yy-merge-core = { path = "crates/yy-merge-core" }
yy-merge-cli = { path = "crates/yy-merge-cli" }
yy-merge-ui = { path = "crates/yy-merge-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
