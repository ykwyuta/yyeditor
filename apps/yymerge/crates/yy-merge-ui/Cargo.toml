[package]
name = "yy-merge-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
yy-config = { path = "../../../../crates/yy-config" }
yy-merge-core.workspace = true
yy-merge-cli.workspace = true
yy-ui-win = { path = "../../../../crates/yy-ui-win", features = ["help"] }
yy-core = { path = "../../../../crates/yy-core" }
yy-search = { path = "../../../../crates/yy-search" }
yy-buffer = { path = "../../../../crates/yy-buffer" }
yy-layout = { path = "../../../../crates/yy-layout" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Console"] }
