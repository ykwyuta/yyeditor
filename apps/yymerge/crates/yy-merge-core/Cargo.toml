[package]
name = "yy-merge-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yy-config = { path = "../../../../crates/yy-config" }
yy-ssh = { path = "../../../../crates/yy-ssh" }
yy-remote = { path = "../../../../crates/yy-remote" }
yy-io = { path = "../../../../crates/yy-io" }
yy-buffer = { path = "../../../../crates/yy-buffer" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
yy-encoding = { git = "https://github.com/ykwyuta/YYLibrary", rev = "57deca92c834227f705496fd7c5c4a226ec8dc97" }
blake3 = { version = "1.8", features = ["pure"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
base64 = "0.22"
hayro = "=0.8.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Memory"] }
