[package]
name = "yy-ui-win"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
help = ["dep:yy-preview", "dep:webview2-com"]

[target.'cfg(windows)'.dependencies]
yy-config.workspace = true
yy-core.workspace = true
yy-layout.workspace = true
yy-sheet.workspace = true
yy-syntax.workspace = true
yy-preview = { workspace = true, optional = true }
webview2-com = { workspace = true, optional = true }
windows-numerics.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
yy-buffer.workspace = true

[lints]
workspace = true
