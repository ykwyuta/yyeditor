[package]
name = "yy-ssh-crypto"
description = "RustCrypto packet encryption for SSH AES-GCM and OpenSSH ChaCha20-Poly1305"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "zeroize"] }
chacha20 = { version = "0.10.2", features = ["legacy", "zeroize"] }
poly1305 = { version = "0.9.1", features = ["zeroize"] }
subtle = "2.6"
zeroize = "1.8"

[dev-dependencies]
ring = "0.17.14"

[lints]
workspace = true
