[package]
name = "yy-tls-crypto"
description = "Shared RustCrypto TLS provider with TLS 1.2/1.3 interoperability checks"
version.workspace = true
edition.workspace = true
rust-version = "1.87"
license.workspace = true

[dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "=0.0.2-alpha", path = "../../vendor/rustls-rustcrypto" }

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
rcgen.workspace = true
yy-cert.workspace = true
tempfile.workspace = true
x509-parser = { version = "0.18", default-features = false }

[lints]
workspace = true
