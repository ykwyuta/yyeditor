[package]
name = "yy-3270-tls"
description = "TLS for yyterm's 3270 sessions (implicit TLS, Telnet STARTTLS, TOFU for certificates, client certificates)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["rustls"]
# rustls + RustCrypto による TLS。無効なら型と設定だけを利用できる。
rustls = ["dep:rustls", "dep:rustls-native-certs", "dep:yy-tls-crypto"]

[dependencies]
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
yy-tls-crypto = { workspace = true, optional = true }
sha2.workspace = true

[dev-dependencies]
rustls = { workspace = true, features = ["ring"] }
rcgen.workspace = true
yy-cert.workspace = true
tempfile.workspace = true

[lints]
workspace = true
