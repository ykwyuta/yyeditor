name = "Rust"
extensions = ["rs"]
line_comment = "//"
block_comment = ["/*", "*/"]

[keywords]
keyword = ["as", "async", "await", "break", "const", "continue", "crate", "dyn", "else", "enum", "extern", "fn", "for", "if", "impl", "in", "let", "loop", "match", "mod", "move", "mut", "pub", "ref", "return", "self", "Self", "static", "struct", "super", "trait", "type", "unsafe", "use", "where", "while", "macro_rules", "union", "yield"]
type = ["bool", "char", "str", "u8", "u16", "u32", "u64", "u128", "usize", "i8", "i16", "i32", "i64", "i128", "isize", "f32", "f64", "String", "Vec", "Option", "Result", "Box", "Rc", "Arc", "HashMap"]
constant = ["true", "false", "None", "Some", "Ok", "Err"]
[[context.main]]
match = '//.*$'
token = "comment"
[[context.main]]
begin = '/\*'
end = '\*/'
token = "comment"
[[context.main]]
begin = 'r#+"'
end = '"#+'
token = "string"
[[context.main]]
begin = 'r"'
end = '"'
token = "string"
[[context.main]]
begin = 'b?"'
end = '"'
skip = '\\.'
token = "string"
[[context.main]]
match = '''b?'(?:\\.|[^'\\])''''
token = "string"
[[context.main]]
match = '#!?\[[^\]]*\]'
token = "attribute"
[[context.main]]
match = ''''[a-zA-Z_]\w*\b(?:[^']|$)'''
token = "label"
[[context.main]]
match = '\b([a-z_][a-z0-9_]*!)'
captures = { 1 = "function" }
[[context.main]]
match = '\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|[0-9][0-9_]*(?:\.[0-9_]*)?(?:[eE][+-]?[0-9]+)?)[a-zA-Z0-9]*\b'
token = "number"
[[context.main]]
match = '\b([\p{L}_][\p{L}\p{N}_]*)\s*\('
captures = { 1 = "function" }
