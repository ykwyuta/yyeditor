name = "JavaScript"
extensions = ["js", "mjs", "cjs", "jsx"]
aliases = ["js", "node"]
first_line = '^#!.*\bnode\b'
line_comment = "//"
block_comment = ["/*", "*/"]

[keywords]
keyword = ["break", "case", "catch", "class", "const", "continue", "debugger", "default", "delete", "do", "else", "export", "extends", "finally", "for", "from", "function", "if", "import", "in", "instanceof", "let", "new", "of", "return", "static", "super", "switch", "this", "throw", "try", "typeof", "var", "void", "while", "with", "yield", "async", "await", "get", "set"]
constant = ["null", "undefined", "true", "false", "NaN", "Infinity"]
[[context.main]]
match = '//.*$'
token = "comment"
[[context.main]]
begin = '/\*'
end = '\*/'
token = "comment"
[[context.main]]
begin = '`'
end = '`'
skip = '\\.'
token = "string"
[[context.main]]
begin = '"'
end = '"|$'
skip = '\\.'
token = "string"
[[context.main]]
begin = ''''''''
end = ''''|$'''
skip = '\\.'
token = "string"
[[context.main]]
match = '\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|[0-9][0-9_]*(?:\.[0-9_]*)?(?:[eE][+-]?[0-9]+)?)[a-zA-Z0-9]*\b'
token = "number"
[[context.main]]
match = '\b([\p{L}_][\p{L}\p{N}_]*)\s*\('
captures = { 1 = "function" }
