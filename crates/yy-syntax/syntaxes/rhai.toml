name = "Rhai"
extensions = ["rhai"]
line_comment = "//"
block_comment = ["/*", "*/"]

[keywords]
keyword = ["let", "const", "if", "else", "switch", "do", "while", "loop", "until", "for", "in", "continue", "break", "return", "throw", "try", "catch", "fn", "private", "import", "export", "as", "global", "is_shared", "this"]
constant = ["true", "false"]
builtin = ["wait_unlocked", "wait_text", "wait_text_at", "wait_change", "text_at", "row", "screen_lines", "screen_text", "rows", "cols", "cursor", "locked", "fields", "field_at", "move_to", "tab", "home", "type", "input", "key", "password", "transfer_get", "transfer_put", "print_screen", "csv_open", "text_open", "write_row", "write_line", "close", "log", "message", "ask", "sleep", "print", "debug", "len", "trim", "contains", "split", "sub_string", "index_of", "to_upper", "to_lower", "parse_int", "to_string", "type_of"]
[[context.main]]
match = '//.*$'
token = "comment"
[[context.main]]
begin = '/\*'
end = '\*/'
token = "comment"
[[context.main]]
begin = '`'
end = '`'
skip = '\\.'
token = "string"
[[context.main]]
begin = '"'
end = '"|$'
skip = '\\.'
token = "string"
[[context.main]]
match = ''''(?:\\.|[^'\\])+''''
token = "string"
[[context.main]]
match = '\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|[0-9][0-9_]*(?:\.[0-9_]*)?(?:[eE][+-]?[0-9]+)?)\b'
token = "number"
[[context.main]]
match = '\b([\p{L}_][\p{L}\p{N}_]*)\s*\('
captures = { 1 = "function" }
