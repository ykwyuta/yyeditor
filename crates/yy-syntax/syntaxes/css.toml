name = "CSS"
extensions = ["css", "scss", "less"]
block_comment = ["/*", "*/"]

[keywords]
constant = ["important", "inherit", "initial", "unset", "none", "auto"]
[[context.main]]
begin = '/\*'
end = '\*/'
token = "comment"
[[context.main]]
match = '//.*$'
token = "comment"
[[context.main]]
match = '@[\w-]+'
token = "keyword"
[[context.main]]
begin = '\{'
end = '\}'
token = "punctuation"
contains = "body"
[[context.main]]
match = '[.#][\w-]+'
token = "type"
[[context.main]]
match = '::?[\w-]+'
token = "function"
[[context.main]]
match = '[A-Za-z][\w-]*'
token = "tag"
[[context.body]]
begin = '/\*'
end = '\*/'
token = "comment"
[[context.body]]
match = '([\w-]+)\s*:'
captures = { 1 = "property" }
[[context.body]]
begin = '"'
end = '"'
skip = '\\.'
token = "string"
[[context.body]]
begin = ''''''''
end = ''''''''
skip = '\\.'
token = "string"
[[context.body]]
match = '#[0-9a-fA-F]{3,8}\b'
token = "number"
[[context.body]]
match = '-?[0-9]+(?:\.[0-9]+)?(?:px|em|rem|%|vh|vw|pt|s|ms|deg|fr)?'
token = "number"
[[context.body]]
begin = '\{'
end = '\}'
token = "punctuation"
contains = "body"
