name = "C"
extensions = ["c", "h"]
line_comment = "//"
block_comment = ["/*", "*/"]

[keywords]
keyword = ["if", "else", "for", "while", "do", "switch", "case", "default", "break", "continue", "return", "goto", "sizeof", "typedef", "struct", "union", "enum", "extern", "static", "const", "volatile", "register", "inline", "restrict", "_Alignas", "_Alignof", "_Atomic", "_Generic", "_Noreturn", "_Static_assert", "_Thread_local"]
type = ["int", "char", "short", "long", "float", "double", "void", "signed", "unsigned", "_Bool", "_Complex", "size_t", "ssize_t", "ptrdiff_t", "wchar_t", "int8_t", "int16_t", "int32_t", "int64_t", "uint8_t", "uint16_t", "uint32_t", "uint64_t", "intptr_t", "uintptr_t", "FILE", "bool"]
constant = ["NULL", "true", "false", "EOF", "stdin", "stdout", "stderr"]
[[context.main]]
match = '//.*$'
token = "comment"
[[context.main]]
begin = '/\*'
end = '\*/'
token = "comment"
[[context.main]]
begin = '"'
end = '"|$'
skip = '\\.'
token = "string"
[[context.main]]
match = ''''(?:\\.|[^'\\])''''
token = "string"
[[context.main]]
match = '^\s*#\s*[a-zA-Z_]+'
token = "preprocessor"
[[context.main]]
match = '\b(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|[0-9][0-9_]*(?:\.[0-9_]*)?(?:[eE][+-]?[0-9]+)?)[a-zA-Z0-9]*\b'
token = "number"
[[context.main]]
match = '\b([\p{L}_][\p{L}\p{N}_]*)\s*\('
captures = { 1 = "function" }
