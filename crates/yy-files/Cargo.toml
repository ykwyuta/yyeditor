[package]
name = "yy-files"
description = "File management core for yyfilemanager: scanning and catalogs, folder sync to shares with resume, duplicate and version detection, reviewed purge and file search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# 既存のビルドコマンドとの互換用。BLAKE3 は共有依存で常に pure を有効にする。
blake3-pure = ["blake3/pure"]

[dependencies]
blake3.workspace = true
crc32fast = "1"
encoding_rs.workspace = true
flate2 = "1"
# xz・7z の LZMA/LZMA2 を展開する（Rust だけ）
lzma-rs = "0.3"
miniz_oxide.workspace = true
postcard.workspace = true
rayon.workspace = true
regex-automata.workspace = true
# 一括リネームのスクリプト（3270 のマクロと同じ版・機能）
rhai = { version = "1.26", default-features = false, features = ["std", "no_module", "no_custom_syntax"] }
serde.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
yy-buffer.workspace = true
yy-core.workspace = true
yy-search.workspace = true

# ACL を写す（同期の copy_acl）・裏の処理の優先度を下げる
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
]

[dev-dependencies]
yy-encoding.workspace = true
tempfile.workspace = true
proptest.workspace = true

[lints]
workspace = true
